file_format: definition/2
# Proposal fragment: the decision operation as a span.
# Follows the gen_ai.execute_tool.internal pattern (a non-inference operation
# emitted by application/infra code, not by model-call instrumentation).

attribute_groups:
  - id: attributes.gen_ai.execute_authorization.common
    visibility: internal
    attributes:
      - ref: gen_ai.agent.authorization.outcome
        requirement_level: required
        sampling_relevant: true
      - ref: gen_ai.agent.authorization.policy.name
        requirement_level: recommended
      - ref: gen_ai.agent.authorization.policy.version
        requirement_level:
          conditionally_required: >
            When `gen_ai.agent.authorization.policy.name` is set and the producer's policy
            store carries a revision identifier.
      - ref: gen_ai.agent.authorization.reason
        requirement_level:
          conditionally_required: When `gen_ai.agent.authorization.outcome` is not `allow`.
      - ref: gen_ai.agent.capability
        requirement_level: recommended

spans:
  - type: gen_ai.execute_authorization.internal
    kind: internal
    requirement_level: recommended
    name:
      note: >
        **Span name** SHOULD be `execute_authorization {gen_ai.agent.capability}`
        (or `execute_authorization` when no capability is available).
    brief: Describes one agent authorization/governance decision.
    note: |
      `gen_ai.operation.name` SHOULD be `execute_authorization`.

      This span represents a single decision made by the deciding component (a policy
      decision point, agent gateway, or governance layer in front of an agent action).
      It is NOT emitted by agent-level or model-call instrumentation, which does not
      have access to the trust/risk/scan inputs or the authority basis the decision is
      measured against.

      **Emission.** Instrumentation SHOULD emit this span for every evaluation it
      performs that is consulted before the action and whose answer determines whether
      the action proceeds, **including evaluations that refuse**. A gate that blocks a
      call and emits nothing leaves no record of the refusal, and downstream that is
      indistinguishable from a call that was never made. This is the property the
      operation exists to provide.

      Instrumentation SHOULD NOT emit this span for a policy evaluated over activity
      that has already completed. No answer such an evaluation reaches could have
      prevented the action, and recording it here mixes two populations in
      `gen_ai.agent.authorization.duration`: how long a caller waited, and how long a
      batch evaluation took. This convention does not say where such an evaluation
      belongs.

      Spans may be sampled or dropped in transit. The absence of this span is not
      evidence that no evaluation occurred.

      **Correlation.** Where the deciding component itself creates the span for the
      permitted action, in the same process and within this span's context, that span
      SHOULD be a child of this one. Where the decision is made by a separate service,
      or the action is instrumented by a different producer, that relationship is not
      available to either party, and its absence carries no meaning. No public producer
      emits this relationship today. How a decision should be correlated with the action
      it governed is an open question on this proposal rather than a settled part of it.

      **Reading the outcome.** `gen_ai.agent.authorization.outcome` is what
      distinguishes one outcome from another. Span shape does not: `deny`, `escalate`
      and `error` all produce a decision span with no permitted action beneath it.
      Consumers SHOULD partition on the attribute rather than on the presence or absence
      of a child span.

      **Scope.** This operation models one evaluation by a deciding component and
      records the answer that component gave, not the final disposition of the action.

      A gate that is consulted before the action but is configured not to refuse (a
      monitoring, permissive or dry-run deployment) is in scope. It records the answer
      it gave, so a producer whose policy evaluated to `deny` while deployed not to
      enforce records `deny`, with the basis on `gen_ai.agent.authorization.reason`. The
      outcome is not rewritten to `allow` because the action went ahead; that would
      destroy the answer the policy actually gave. This convention does not currently
      carry the deployment mode on any attribute, which is a gap rather than a decision.

      A decision that defers to a higher authority (`outcome` = `escalate`) is complete
      when the deferral is recorded. A resolution reached outside that evaluation is not
      a second evaluation and is not represented by this operation. An execution that
      follows an out-of-band approval therefore carries no decision span of its own;
      that gap is stated rather than closed here.

      The signal attributes (`gen_ai.agent.trust.*`, `drift.*`, `scan.*`,
      `public_key.algorithm`) are OPTIONAL producer-specific enrichment on this span,
      not part of the operation's required shape.
    stability: development
    attributes:
      - ref_group: attributes.gen_ai.error
      - ref_group: attributes.gen_ai.execute_authorization.common
      - ref: gen_ai.operation.name
        requirement_level: required
        sampling_relevant: true
      # --- OPTIONAL signal enrichment (opt_in; only producers that compute them) ---
      - ref: gen_ai.agent.public_key.algorithm
        requirement_level: opt_in
      - ref: gen_ai.agent.public_key.verification
        requirement_level:
          conditionally_required: When `gen_ai.agent.public_key.algorithm` is set.
      - ref: gen_ai.agent.trust.score
        requirement_level: opt_in
      - ref: gen_ai.agent.trust.method
        requirement_level:
          conditionally_required: When `gen_ai.agent.trust.score` is set.
      - ref: gen_ai.agent.drift.score
        requirement_level: opt_in
      - ref: gen_ai.agent.drift.method
        requirement_level:
          conditionally_required: When `gen_ai.agent.drift.score` is set.
      - ref: gen_ai.agent.scan.verdict
        requirement_level: opt_in
      - ref: gen_ai.agent.scan.method
        requirement_level:
          conditionally_required: When `gen_ai.agent.scan.verdict` is set.
